{% extends 'base/base.html' %}

{% block meta_title %}borrow {{book.title}}{% endblock %}

{% block main %}

  {% if not error %}
    <h3>confirm borrow book </h3>
    <h4>{{ book.title }}</h4>
    <h4>{{ book.author }}</h4>
    <p>
      due date: {{ due_date|date:"Y/m/d H:i"}}
    </p>

    <form method="post">
      {% csrf_token %}
      <button>submit</button>
    </form>
  {% else %}
    {{error}}
  
  {% endif %}

{% endblock %}
